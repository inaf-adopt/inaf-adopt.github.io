name: Check member profiles
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate profile data
        run: node scripts/validate-members.cjs --self-test
      - name: Check project pages and curated bibliography
        run: |
          node scripts/check-site.cjs --allow-profile-drift
          node scripts/build-project-pages.cjs --check
          node --check script.js
          node --check profile-live.js
