<title id="title">Simplified optical principle of MezzoCielo monocentric telescope</title><desc id="desc">Original not-to-scale schematic with a spherical glass shell enclosing optical fluid and correcting cameras positioned along a curved focal surface. Incoming rays from several directions illustrate the principle; the paths are not optical ray tracing.</desc>
