<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Ingot wavefront sensor concept for an elongated sodium laser guide star</title>
<desc id="desc">Illustrative sodium laser guide star, ray path, reflective roof prism and three pupil images. Not a scaled optical layout.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102b49"/><stop offset="1" stop-color="#214e62"/></linearGradient><linearGradient id="ingot" x2="0" y2="1"><stop stop-color="#f2c17c"/><stop offset="1" stop-color="#df845c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="13"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8edbda"/></marker></defs>
<rect width="1280" height="720" rx="22" fill="#f5f8f6"/><rect x="26" y="26" width="1228" height="668" rx="18" fill="url(#sky)"/>
<text x="72" y="88" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#f9fbfa">Why the Ingot sensor?</text>
<text x="72" y="122" font-family="Arial,sans-serif" font-size="17" fill="#c1dfe1">A sodium laser beacon has depth, not the shape of a point source</text>
<path d="M64 574 Q370 526 622 574" fill="none" stroke="#8bb6bd" stroke-width="3" opacity=".5"/>
<path d="M105 585 L225 585 L225 561 L353 561 L353 585 L455 585 L455 602 L105 602Z" fill="#142b3f" stroke="#accdd1" stroke-width="3"/>
<path d="M162 561 Q280 440 405 561" fill="none" stroke="#d5eef0" stroke-width="5"/>
<path d="M272 561 L300 190" fill="none" stroke="#eca86b" stroke-width="5" stroke-dasharray="11 10" opacity=".8"/>
<path d="M292 191 L364 191" fill="none" stroke="#f4c586" stroke-width="3"/>
<rect x="304" y="161" width="49" height="141" rx="24" fill="#ffd08b" opacity=".5" filter="url(#glow)"/>
<rect x="311" y="164" width="38" height="136" rx="19" fill="#f4cb87" opacity=".96"/>
<path d="M327 168 L327 296" stroke="#fff5df" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 17"/>
<path d="M338 302 L560 392 L674 450" fill="none" stroke="#8edbda" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M328 164 L547 369 L674 450" fill="none" stroke="#8edbda" stroke-width="3" opacity=".65"/>
<text x="103" y="385" font-family="Arial,sans-serif" fill="#fff2d7" font-size="20" font-weight="700">Elongated sodium beacon</text>
<text x="102" y="411" font-family="Arial,sans-serif" fill="#c4d9e2" font-size="16">Finite-distance, three-dimensional source</text>
<text x="161" y="639" font-family="Arial,sans-serif" fill="#b5d4db" font-size="19">Telescope &amp; off-axis laser launcher</text>
<path d="M672 450 L734 380 L790 450 L734 502Z" fill="url(#ingot)" stroke="#ffdfaa" stroke-width="4"/>
<path d="M734 380 L734 502" stroke="#ffe1a5" stroke-width="3"/>
<path d="M736 445 L918 335" fill="none" stroke="#8edbda" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M736 445 L918 445" fill="none" stroke="#8edbda" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M736 445 L918 555" fill="none" stroke="#8edbda" stroke-width="4" marker-end="url(#arrow)"/>
<text x="678" y="550" font-family="Arial,sans-serif" fill="#ffdfad" font-size="19" font-weight="700">Ingot prism</text>
<text x="674" y="577" font-family="Arial,sans-serif" fill="#d0e3e5" font-size="15">Illustrative roof-prism geometry</text>
<rect x="931" y="249" width="255" height="382" rx="18" fill="#eaf5f4" stroke="#accdd0" stroke-width="2"/>
<text x="959" y="290" font-family="Arial,sans-serif" fill="#1d4051" font-size="23" font-weight="700">Three pupil images</text>
<g stroke="#2f6a80" stroke-width="2"><circle cx="1059" cy="352" r="34" fill="#66b7c1" opacity=".9"/><circle cx="1007" cy="453" r="34" fill="#6dbcc6" opacity=".9"/><circle cx="1111" cy="453" r="34" fill="#6dbcc6" opacity=".9"/></g>
<g fill="#204d5e" font-family="Arial,sans-serif" font-weight="700" font-size="17" text-anchor="middle"><text x="1059" y="359">P1</text><text x="1007" y="460">P2</text><text x="1111" y="460">P3</text></g>
<text x="959" y="545" font-family="Arial,sans-serif" fill="#38596a" font-size="17">Relative pupil illumination</text><text x="959" y="570" font-family="Arial,sans-serif" fill="#38596a" font-size="17">encodes wavefront gradients</text>
<text x="72" y="674" fill="#accad1" font-family="Arial,sans-serif" font-size="14">Explanatory diagram · not to scale · based on Ragazzoni et al. (2024) and Di Filippo et al. (2022)</text>
